# .github/workflows/ci.yml
name: Selenoid Tests Workflow

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Клонируем код
      - name: Checkout repository
        uses: actions/checkout@v4  # Обновлено до v4
      
      # 2. Подготавливаем окружение
      - name: Set up Python
        uses: actions/setup-python@v5  # Обновлено до v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest
      
      # 3. Запускаем Selenoid (как в курсе)
      - name: Pull selenoid image
        run: docker pull selenoid/chrome:128.0
      
      - name: Start Selenoid
        run: |
          docker run -d --name selenoid -p 4444:4444 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/browser.json:/etc/selenoid/browser.json \
            aerokube/selenoid:latest
      
      # 4. Ожидаем запуска Selenoid
      - name: Wait for Selenoid
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:4444/status; then
              echo "✅ Selenoid is ready!"
              break
            fi
            echo "⏳ Waiting for Selenoid... ($i/10)"
            sleep 2
          done
      
      # 5. Запускаем тесты
      - name: Run tests
        run: |
          pytest tests/ -v --alluredir=allure-results
        env:
          SELENOID_URL: http://localhost:4444
          BASE_URL: ${{ secrets.BASE_URL || 'https://foodgram-frontend-1.foodgram.education-services.ru' }}
      
      # 6. Генерируем Allure отчет
      - name: Install Allure
        run: |
          sudo apt-add-repository -y ppa:qameta/allure
          sudo apt-get update
          sudo apt-get install -y allure
      
      - name: Generate Allure Report
        run: allure generate allure-results -o allure-report --clean
      
      # 7. Сохраняем артефакты (обновлено до v4)
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: allure-results/
      
      # 8. Очистка
      - name: Stop Selenoid
        if: always()
        run: docker stop selenoid && docker rm selenoid || true